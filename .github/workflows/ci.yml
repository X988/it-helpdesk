name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
          POSTGRES_DB: helpdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://helpdesk:helpdesk@127.0.0.1:5432/helpdesk_test
      TEST_DATABASE_URL: postgresql://helpdesk:helpdesk@127.0.0.1:5432/helpdesk_test
      APP_URL: http://localhost:3000
      ALLOW_INSECURE_HTTP: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      BOOTSTRAP_ADMIN_EMAIL: admin@example.test
      BOOTSTRAP_ADMIN_NAME: CI Administrator
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-synthetic-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - run: npx prisma validate
      - run: npm run db:generate
      - name: Apply migrations and verify repeat deployment
        run: npm run db:migrate && npm run db:migrate
      - name: Check migration/schema consistency
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run db:bootstrap
      - name: HTTP smoke test against production build
        run: |
          NODE_ENV=production npm start > /tmp/helpdesk-server.log 2>&1 &
          helpdesk_server_pid=$!
          trap 'kill "$helpdesk_server_pid" 2>/dev/null || true' EXIT
          node scripts/smoke.mjs
      - name: Build and run production image
        run: |
          docker build --target runner -t helpdesk-ci .
          docker run --rm --entrypoint node helpdesk-ci -e "const fs=require('node:fs');const prisma=require('@prisma/client');if(!fs.existsSync('.next/BUILD_ID')||!prisma.PrismaClient)process.exit(1);"
          docker run -d --name helpdesk-runtime --network host -e DATABASE_URL -e APP_URL -e ALLOW_INSECURE_HTTP -e NODE_ENV=production helpdesk-ci
          trap 'docker logs helpdesk-runtime; docker rm -f helpdesk-runtime' EXIT
          node scripts/smoke.mjs
      - name: Save failed server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk-server-log
          path: /tmp/helpdesk-server.log
          if-no-files-found: ignore
