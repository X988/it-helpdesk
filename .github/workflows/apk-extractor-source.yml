name: APK Extractor Source Package

on:
  push:
    branches:
      - apk-extractor-build-20260925

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        working-directory: apk-extractor
        run: gradle wrapper --gradle-version 8.13

      - name: Package Android Studio project
        run: |
          rm -f apk-extractor/BUILD_TRIGGER.txt
          cd apk-extractor
          zip -r ../APKExtractor-AndroidStudio-project.zip .             -x 'app/build/*' '.gradle/*' '*.iml' '.idea/*'

      - name: Upload project
        uses: actions/upload-artifact@v4
        with:
          name: APKExtractor-project
          path: APKExtractor-AndroidStudio-project.zip
          if-no-files-found: error
